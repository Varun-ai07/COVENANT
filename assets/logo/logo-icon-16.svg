<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="16" height="16" fill="#0F0F1A" rx="2"/>

  <!-- Orbital rings -->
  <ellipse cx="8" cy="8" rx="5.5" ry="2.5" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.4" transform="rotate(-30 8 8)"/>
  <ellipse cx="8" cy="8" rx="5.5" ry="2.5" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.4" transform="rotate(30 8 8)"/>
  <ellipse cx="8" cy="8" rx="5.5" ry="2.5" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.4" transform="rotate(90 8 8)"/>

  <!-- Connection lines -->
  <g stroke="#F59E0B" stroke-width="0.3" opacity="0.6">
    <line x1="3" y1="6" x2="8" y2="8"/>
    <line x1="13" y1="6" x2="8" y2="8"/>
    <line x1="8" y1="13.5" x2="8" y2="8"/>
  </g>

  <!-- Orbital nodes -->
  <g fill="url(#orbitGrad)">
    <circle cx="3" cy="6" r="0.8"/>
    <circle cx="13" cy="6" r="0.8"/>
    <circle cx="8" cy="13.5" r="0.8"/>
  </g>

  <!-- Central core -->
  <circle cx="8" cy="8" r="1.8" fill="url(#coreGrad)"/>
  <circle cx="8" cy="8" r="1" fill="#0F0F1A"/>
  <circle cx="8" cy="8" r="0.5" fill="#FCD34D"/>
</svg>