<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- White/Light background -->
  <rect width="200" height="200" fill="#FFFFFF" rx="12"/>

  <!-- Orbital rings -->
  <ellipse cx="100" cy="100" rx="70" ry="30" fill="none" stroke="#D97706" stroke-width="2" opacity="0.3" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="70" ry="30" fill="none" stroke="#D97706" stroke-width="2" opacity="0.3" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="70" ry="30" fill="none" stroke="#D97706" stroke-width="2" opacity="0.3" transform="rotate(90 100 100)"/>

  <!-- Connection lines to center -->
  <g stroke="#D97706" stroke-width="1" opacity="0.5">
    <line x1="40" y1="75" x2="100" y2="100"/>
    <line x1="160" y1="75" x2="100" y2="100"/>
    <line x1="100" y1="170" x2="100" y2="100"/>
  </g>

  <!-- Orbital nodes (agents) -->
  <g fill="url(#orbitGrad)">
    <circle cx="40" cy="75" r="8"/>
    <circle cx="160" cy="75" r="8"/>
    <circle cx="100" cy="170" r="8"/>
  </g>

  <!-- Central core (trust) -->
  <circle cx="100" cy="100" r="20" fill="url(#coreGrad)"/>
  <circle cx="100" cy="100" r="12" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="6" fill="#FCD34D"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="#FCD34D" stroke-width="1" opacity="0.4"/>
</svg>