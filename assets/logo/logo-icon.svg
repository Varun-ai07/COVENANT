<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#0F0F1A" rx="4"/>

  <!-- Orbital rings (scaled proportionally from 200x200) -->
  <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.4" transform="rotate(-30 16 16)"/>
  <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.4" transform="rotate(30 16 16)"/>
  <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.4" transform="rotate(90 16 16)"/>

  <!-- Connection lines -->
  <g stroke="#F59E0B" stroke-width="0.4" opacity="0.6">
    <line x1="6" y1="12" x2="16" y2="16"/>
    <line x1="26" y1="12" x2="16" y2="16"/>
    <line x1="16" y1="27" x2="16" y2="16"/>
  </g>

  <!-- Orbital nodes -->
  <g fill="url(#orbitGrad)" filter="url(#glow)">
    <circle cx="6" cy="12" r="1.5"/>
    <circle cx="26" cy="12" r="1.5"/>
    <circle cx="16" cy="27" r="1.5"/>
  </g>

  <!-- Central core -->
  <circle cx="16" cy="16" r="3.5" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="2" fill="#0F0F1A"/>
  <circle cx="16" cy="16" r="1" fill="#FCD34D"/>

  <!-- Inner glow ring -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#FCD34D" stroke-width="0.3" opacity="0.5"/>
</svg>