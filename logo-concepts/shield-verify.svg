<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6EE7B7"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- Shield shape -->
  <path d="M100 25 L160 50 L160 110 C160 145 130 175 100 185 C70 175 40 145 40 110 L40 50 Z"
        fill="url(#shieldGrad)"
        stroke="#34D399"
        stroke-width="2"/>

  <!-- Inner shield highlight -->
  <path d="M100 35 L150 55 L150 108 C150 138 125 163 100 172 C75 163 50 138 50 108 L50 55 Z"
        fill="none"
        stroke="#6EE7B7"
        stroke-width="1"
        opacity="0.5"/>

  <!-- Checkmark -->
  <polyline points="65,100 90,125 140,70"
            fill="none"
            stroke="url(#checkGrad)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- Checkmark shadow for depth -->
  <polyline points="65,100 90,125 140,70"
            fill="none"
            stroke="#0F0F1A"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.3"/>

  <!-- Embedded circuit nodes -->
  <g fill="#6EE7B7" opacity="0.8">
    <circle cx="100" cy="155" r="3"/>
    <circle cx="85" cy="145" r="2"/>
    <circle cx="115" cy="145" r="2"/>
  </g>
</svg>