<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F43F5E"/>
      <stop offset="50%" style="stop-color:#E11D48"/>
      <stop offset="100%" style="stop-color:#BE123C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- Infinity loop -->
  <path d="M60 100
           C60 70, 95 70, 100 100
           C105 130, 140 130, 140 100
           C140 70, 105 70, 100 100
           C95 130, 60 130, 60 100"
        fill="none"
        stroke="url(#infGrad)"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Inner highlight stroke -->
  <path d="M65 100
           C65 75, 95 75, 100 100
           C105 125, 135 125, 135 100
           C135 75, 105 75, 100 100
           C95 125, 65 125, 65 100"
        fill="none"
        stroke="#FDA4AF"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- Center lock icon where loops meet -->
  <g transform="translate(88, 88)">
    <!-- Lock body -->
    <rect x="0" y="8" width="24" height="18" rx="3" fill="#E11D48"/>
    <!-- Lock shackle -->
    <path d="M6 8 L6 4 C6 0, 18 0, 18 4 L18 8"
          fill="none"
          stroke="#FDA4AF"
          stroke-width="3"
          stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="12" cy="15" r="3" fill="#0F0F1A"/>
    <rect x="11" y="15" width="2" height="5" fill="#0F0F1A"/>
  </g>

  <!-- Accent dots -->
  <g fill="#FDA4AF">
    <circle cx="50" cy="100" r="4"/>
    <circle cx="150" cy="100" r="4"/>
  </g>
</svg>