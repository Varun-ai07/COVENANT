<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- Concentric rings -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#2DD4BF" stroke-width="2.5" opacity="0.8"/>

  <!-- Central pulse -->
  <circle cx="100" cy="100" r="18" fill="url(#pulseGrad)"/>
  <circle cx="100" cy="100" r="10" fill="#0F0F1A"/>
  <circle cx="100" cy="100" r="5" fill="#5EEAD4"/>

  <!-- Pulse wave (animated feel via multiple arcs) -->
  <g fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round">
    <path d="M100 75 Q115 60 140 60" opacity="0.7"/>
    <path d="M125 100 Q140 85 160 90" opacity="0.5"/>
    <path d="M60 90 Q80 85 100 75" opacity="0.6"/>
  </g>

  <!-- Data points around rings -->
  <g fill="#2DD4BF">
    <circle cx="100" cy="25" r="3"/>
    <circle cx="165" cy="65" r="3"/>
    <circle cx="175" cy="100" r="3"/>
    <circle cx="100" cy="175" r="3"/>
    <circle cx="35" cy="65" r="3"/>
    <circle cx="25" cy="100" r="3"/>
  </g>
</svg>