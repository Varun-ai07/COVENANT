<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>

    <!-- Inner fill -->
    <linearGradient id="innerFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F3FF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon -->
  <polygon
    points="100,15 172,57.5 172,142.5 100,185 28,142.5 28,57.5"
    fill="url(#hexGrad)"
    stroke="#7C3AED"
    stroke-width="2"/>

  <!-- Inner hexagon (trust seal) -->
  <polygon
    points="100,35 152,67.5 152,132.5 100,165 48,132.5 48,67.5"
    fill="url(#innerFill)"
    stroke="#A78BFA"
    stroke-width="1.5"
    stroke-dasharray="8,4"/>

  <!-- Central interlocking knot -->
  <g>
    <!-- Triangle 1 (pointing up) -->
    <polygon
      points="100,55 130,110 70,110"
      fill="#EEF2FF"
      stroke="#4F46E5"
      stroke-width="3"
      stroke-linejoin="round"/>

    <!-- Triangle 2 (pointing down, interlocked) -->
    <polygon
      points="100,145 130,90 70,90"
      fill="#E0E7FF"
      stroke="#6366F1"
      stroke-width="3"
      stroke-linejoin="round"/>

    <!-- Center node -->
    <circle cx="100" cy="100" r="8" fill="#6366F1" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="100" cy="100" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Three agent nodes -->
  <g fill="#6366F1" stroke="#4F46E5" stroke-width="1.5">
    <circle cx="100" cy="22" r="5"/>
    <circle cx="164" cy="140" r="5"/>
    <circle cx="36" cy="140" r="5"/>
  </g>

  <!-- Connecting lines -->
  <g stroke="#A78BFA" stroke-width="1" stroke-dasharray="3,3" opacity="0.7">
    <line x1="100" y1="22" x2="100" y2="55"/>
    <line x1="164" y1="140" x2="130" y2="110"/>
    <line x1="36" y1="140" x2="70" y2="110"/>
  </g>
</svg>