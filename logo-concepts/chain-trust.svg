<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <linearGradient id="linkGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- First chain link (cyan) -->
  <ellipse cx="70" cy="100" rx="35" ry="50" fill="none" stroke="url(#chainGrad)" stroke-width="12"/>
  <ellipse cx="70" cy="100" rx="35" ry="50" fill="none" stroke="#0F0F1A" stroke-width="6" clip-path="url(#clip1)"/>

  <!-- Second chain link (purple) - interlocked -->
  <ellipse cx="130" cy="100" rx="35" ry="50" fill="none" stroke="url(#linkGrad2)" stroke-width="12"/>

  <!-- Center highlight where they connect -->
  <circle cx="100" cy="100" r="15" fill="#0F0F1A"/>
  <circle cx="100" cy="100" r="8" fill="url(#chainGrad)" opacity="0.8"/>

  <!-- Glow effect -->
  <ellipse cx="100" cy="100" rx="15" ry="15" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </ellipse>
</svg>