<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#CBD5E1"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="50%" style="stop-color:#0284C7"/>
      <stop offset="100%" style="stop-color:#0369A1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- Eye shape (trust / verification) -->
  <ellipse cx="100" cy="100" rx="60" ry="40" fill="url(#eyeGrad)"/>
  <ellipse cx="100" cy="100" rx="60" ry="40" fill="none" stroke="#64748B" stroke-width="2"/>

  <!-- Upper lid curve -->
  <path d="M40 100 Q100 50 160 100" fill="none" stroke="#F8FAFC" stroke-width="20"/>
  <path d="M40 100 Q100 55 160 100" fill="none" stroke="#64748B" stroke-width="2"/>

  <!-- Iris -->
  <circle cx="100" cy="102" r="25" fill="url(#irisGrad)"/>

  <!-- Pupil with circuit pattern -->
  <circle cx="100" cy="102" r="12" fill="#0F0F1A"/>

  <!-- Pupil inner detail (circuit node) -->
  <circle cx="100" cy="102" r="6" fill="#38BDF8"/>
  <circle cx="100" cy="102" r="3" fill="#0F172A"/>

  <!-- Eye highlight -->
  <circle cx="92" cy="95" r="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- Scan lines (verification aesthetic) -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.3">
    <line x1="50" y1="85" x2="150" y2="85"/>
    <line x1="50" y1="115" x2="150" y2="115"/>
  </g>
</svg>