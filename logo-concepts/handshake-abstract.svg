<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hand1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hand2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- Left hand/grip abstract -->
  <path d="M30 130 Q50 90 90 85 Q110 83 120 95"
        fill="none"
        stroke="url(#hand1)"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Right hand/grip abstract -->
  <path d="M170 130 Q150 90 110 85 Q90 83 80 95"
        fill="none"
        stroke="url(#hand2)"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Interlock detail -->
  <path d="M85 95 L115 95"
        fill="none"
        stroke="#A78BFA"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Fingers wrapping around -->
  <g stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M45 110 Q70 100 95 100" stroke="url(#hand1)" opacity="0.7"/>
    <path d="M155 110 Q130 100 105 100" stroke="url(#hand2)" opacity="0.7"/>
  </g>

  <!-- Clasp point (the covenant) -->
  <circle cx="100" cy="95" r="12" fill="#0F0F1A"/>
  <circle cx="100" cy="95" r="8" fill="url(#hand1)"/>
  <circle cx="100" cy="95" r="4" fill="#DBEAFE"/>

  <!-- Trust lines radiating from clasp -->
  <g stroke="#A78BFA" stroke-width="1" opacity="0.4">
    <line x1="100" y1="75" x2="100" y2="60"/>
    <line x1="120" y1="85" x2="135" y2="70"/>
    <line x1="80" y1="85" x2="65" y2="70"/>
  </g>
</svg>