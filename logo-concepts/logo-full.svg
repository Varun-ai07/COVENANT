<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4B5FD"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" fill="#0F0F1A" rx="8"/>

  <!-- Logo icon (scaled down) -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Outer hexagon -->
    <polygon
      points="100,15 172,57.5 172,142.5 100,185 28,142.5 28,57.5"
      fill="url(#hexGrad)"
      stroke="#A78BFA"
      stroke-width="2"
      filter="url(#glow)"/>

    <!-- Inner hexagon -->
    <polygon
      points="100,35 152,67.5 152,132.5 100,165 48,132.5 48,67.5"
      fill="none"
      stroke="#C4B5FD"
      stroke-width="1.5"
      stroke-dasharray="8,4"/>

    <!-- Triangle up -->
    <polygon
      points="100,55 130,110 70,110"
      fill="none"
      stroke="#E0E7FF"
      stroke-width="3"/>

    <!-- Triangle down -->
    <polygon
      points="100,145 130,90 70,90"
      fill="none"
      stroke="#C7D2FE"
      stroke-width="3"/>

    <!-- Center node -->
    <circle cx="100" cy="100" r="8" fill="#8B5CF6" stroke="#E0E7FF" stroke-width="2"/>
    <circle cx="100" cy="100" r="3" fill="#E0E7FF"/>

    <!-- Agent nodes -->
    <g fill="#A78BFA" stroke="#E0E7FF" stroke-width="1.5">
      <circle cx="100" cy="22" r="5"/>
      <circle cx="164" cy="140" r="5"/>
      <circle cx="36" cy="140" r="5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="130" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="url(#textGrad)">COVENANT</text>

  <!-- Tagline -->
  <text x="132" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280" letter-spacing="2">THE TRUST LAYER FOR AI AGENTS</text>
</svg>