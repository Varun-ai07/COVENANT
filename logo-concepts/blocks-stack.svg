<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="block1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="block2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="block3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#0F0F1A" rx="12"/>

  <!-- Isometric block stack - bottom block -->
  <polygon points="100,160 160,130 100,100 40,130" fill="#4338CA"/>
  <polygon points="100,160 160,130 160,145 100,175 40,145 40,130" fill="url(#block1)"/>

  <!-- Middle block (shifted) -->
  <polygon points="100,125 145,100 100,75 55,100" fill="#6D28D9"/>
  <polygon points="100,125 145,100 145,115 100,140 55,115 55,100" fill="url(#block2)"/>

  <!-- Top block (shifted opposite) -->
  <polygon points="100,90 135,70 100,50 65,70" fill="#7C3AED"/>
  <polygon points="100,90 135,70 135,82 100,102 65,82 65,70" fill="url(#block3)"/>

  <!-- Connection lines between blocks -->
  <g stroke="#C4B5FD" stroke-width="2" opacity="0.6">
    <line x1="100" y1="102" x2="100" y2="125"/>
    <line x1="100" y1="140" x2="100" y2="160"/>
  </g>

  <!-- Node dots on corners -->
  <g fill="#E0E7FF">
    <circle cx="100" cy="50" r="4"/>
    <circle cx="100" cy="175" r="4"/>
  </g>
</svg>